<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>自衛隊紹介サイト</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ================= トップページ画面 ================= -->
  <div id="top-view">
    <header class="top-header">
      <div class="site-title">タイトル</div>
      <nav class="top-nav">
        <a href="#">メニュー</a>
        <a href="#">メニュー</a>
        <a href="#">メニュー</a>
      </nav>
    </header>

    <main class="split-container">
      <!-- 陸 -->
      <div class="split-item" onclick="showDetail('land')">
        <img src="land.jpg" alt="陸上自衛隊">
        <span class="kanji kanji-land">陸</span>
        <div class="hover-overlay">
          <p class="hover-text">詳しく見る</p>
          <span class="hover-arrow">＞</span>
        </div>
      </div>

      <!-- 海 -->
      <div class="split-item" onclick="showDetail('sea')">
        <img src="sea.jpg" alt="海上自衛隊">
        <span class="kanji kanji-sea">海</span>
        <div class="hover-overlay">
          <p class="hover-text">詳しく見る</p>
          <span class="hover-arrow">＞</span>
        </div>
      </div>

      <!-- 空 -->
      <div class="split-item" onclick="showDetail('air')">
        <img src="air.jpg" alt="航空自衛隊">
        <span class="kanji kanji-air">空</span>
        <div class="hover-overlay">
          <p class="hover-text">詳しく見る</p>
          <span class="hover-arrow">＞</span>
        </div>
      </div>
    </main>
  </div>

  <!-- ================= 詳細ページ画面（初期状態は非表示） ================= -->
  <div id="detail-view" class="hidden">
    <div class="detail-banner" id="detail-banner">
      <button class="back-btn" onclick="showTop()">＜ トップへ戻る</button>
      <h1 class="detail-title" id="detail-title">陸上自衛隊</h1>
    </div>

    <div class="cards-container" id="cards-container">
      <!-- JavaScriptでここに3枚のカードが自動生成されます -->
    </div>

    <p class="bottom-note">「イベント」など追加しても◎</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
